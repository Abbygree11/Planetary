plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.107'
}

group = 'dev.planetary'
version = '2.0.0-alpha.1'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = '21.1.215'

    runs {
        client {
            client()
            // Dedicated test-world fixtures: ONLY for the local development
            // runClient profile. Normal distributed mod jars never auto-build.
            jvmArgument '-Dplanetary.debug.fixtures.auto=true'
        }
    }

    mods {
        planetary {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        enable()
        testedMod = mods.planetary
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.mockito:mockito-core:5.20.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // NeoForge's unit-test worker can use a working directory other
    // than the repository root. Publish the census to a fixed absolute
    // build path so GitHub Actions can reliably collect it.
    systemProperty 'planetary.phase2.censusReportDir',
            layout.buildDirectory.dir('reports/planetary').get().asFile.absolutePath
}
